<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Mbaki House Hub logo</title>
  <desc id="desc">Stacked logo: red house roof, minimal table with two chairs and laptops, wifi signal above, "Mbaki House Hub" in serif text underneath.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .roof { fill: none; stroke: #D43D3D; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
      .table { fill: #F5F5F5; stroke: #6B6B6B; stroke-width: 6; stroke-linejoin: round; }
      .chair { fill: #FFFFFF; stroke: #6B6B6B; stroke-width: 6; stroke-linejoin: round; }
      .laptop { fill: #6B6B6B; }
      .wifi { fill: none; stroke: #FF7A00; stroke-width: 10; stroke-linecap: round; }
      .text { fill: #2E2E2E; font-family: Georgia, 'Times New Roman', Times, serif; font-weight: 600; }
    ]]></style>
  </defs>

  <!-- Roof -->
  <path class="roof" d="M180 300 L600 100 L1020 300" />

  <!-- House base subtle line to suggest walls -->
  <rect x="240" y="300" width="720" height="6" fill="#D43D3D" opacity="0.15" />

  <!-- Table -->
  <rect class="table" x="430" y="340" width="340" height="70" rx="8" ry="8" />

  <!-- Chairs (left and right) -->
  <g transform="translate(430, 420)">
    <rect class="chair" x="-60" y="-20" width="90" height="60" rx="8" ry="8" />
    <rect x="-30" y="35" width="150" height="8" fill="#6B6B6B" />
  </g>

  <g transform="translate(770, 420)">
    <rect class="chair" x="-30" y="-20" width="90" height="60" rx="8" ry="8" />
    <rect x="-30" y="35" width="150" height="8" fill="#6B6B6B" />
  </g>

  <!-- Laptops on table (left and right) -->
  <g transform="translate(520, 330)">
    <rect class="laptop" x="-110" y="-40" width="90" height="56" rx="6" ry="6" />
    <rect x="-100" y="-34" width="70" height="40" fill="#FFFFFF" rx="4" ry="4" />
  </g>

  <g transform="translate(680, 330)">
    <rect class="laptop" x="20" y="-40" width="90" height="56" rx="6" ry="6" />
    <rect x="30" y="-34" width="70" height="40" fill="#FFFFFF" rx="4" ry="4" />
  </g>

  <!-- WiFi symbol above roof -->
  <g transform="translate(600, 140)">
    <path class="wifi" d="M0 40 C-45 10 -90 10 -140 40" transform="translate(0, -10) rotate(-12) scale(-1,1)" />
    <path class="wifi" d="M0 60 C-32 30 -64 30 -96 60" transform="translate(0, -10) rotate(-12) scale(-1,1)" />
    <circle cx="0" cy="80" r="10" fill="#FF7A00" />
  </g>

  <!-- Text: Mbaki House Hub -->
  <text class="text" x="600" y="560" text-anchor="middle" font-size="64">Mbaki House Hub</text>

  <!-- Optional smaller baseline for alignment -->
  <rect x="300" y="580" width="600" height="2" fill="#000" opacity="0" />
</svg>
